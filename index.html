<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gemini Twins AI Cinema | @luthando.danxa99</title>
  <style>
    :root {
      --bg: #090b10;
      --surface: #131722;
      --surface-hover: #1c2232;
      --accent: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.25);
      --gold: #ffb300;
      --whatsapp: #25d366;
      --text: #f3f6fc;
      --muted: #94a3b8;
      --border: #232a3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: 85px;
    }

    /* Header */
    header {
      background: linear-gradient(180deg, #101624 0%, var(--bg) 100%);
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      background: linear-gradient(90deg, #ffffff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-title p {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .badge {
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 20px;
    }

    /* Channel Filter Pills */
    .channels {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .channels::-webkit-scrollbar {
      display: none;
    }

    .channel-btn {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .channel-btn.active {
      background: var(--accent);
      color: #05080f;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Main Grid */
    main {
      padding: 16px;
      max-width: 960px;
      margin: 0 auto;
    }

    .section-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (min-width: 640px) {
      .video-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
    }

    /* 9:16 Vertical Card */
    .video-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .video-card:active {
      transform: scale(0.97);
    }

    .video-card:hover {
      border-color: var(--accent);
    }

    .thumb-box {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #05070c;
      overflow: hidden;
    }

    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.88;
      transition: opacity 0.2s ease;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.85) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
    }

    .tag-pill {
      align-self: flex-start;
      background: rgba(9, 11, 16, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--gold);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .play-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(0, 229, 255, 0.9);
      color: #05080f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      margin: auto;
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .card-meta {
      padding: 10px;
    }

    .card-meta h3 {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta p {
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* Fullscreen Theater Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.96);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal.open {
      display: flex;
    }

    .modal-header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .modal-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .close-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .player-wrapper {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .player-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .modal-cta {
      margin-top: 12px;
      width: 100%;
      max-width: 360px;
      background: var(--whatsapp);
      color: #04130a;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.88rem;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      display: block;
    }

    /* Sticky Bottom Agency Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #101522;
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 60;
    }

    .bottom-text strong {
      display: block;
      font-size: 0.82rem;
      color: var(--text);
    }

    .bottom-text span {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .wa-btn {
      background: var(--whatsapp);
      color: #04130a;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 9px 14px;
      border-radius: 8px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-row">
      <div class="brand-title">
        <h1>GEMINI TWINS CINEMA</h1>
        <p>AI Reels, Ads &amp; Stories • @luthando.danxa99</p>
      </div>
      <span class="badge">9:16 STUDIO</span>
    </div>

    <div class="channels" id="channelBar">
      <button class="channel-btn active" data-filter="all">All Videos</button>
      <button class="channel-btn" data-filter="ads">Business Ads</button>
      <button class="channel-btn" data-filter="scifi">Sci-Fi &amp; Lore</button>
      <button class="channel-btn" data-filter="horror">Horror &amp; Mystical</button>
      <button class="channel-btn" data-filter="podcasts">Podcasts &amp; Tech</button>
      <button class="channel-btn" data-filter="stories">Action &amp; Romance</button>
    </div>
  </header>

  <main>
    <div class="section-info">
      <span id="currentChannelLabel">Showing: All Videos</span>
      <span id="videoCount">0 Reels</span>
    </div>
    <div class="video-grid" id="videoGrid"></div>
  </main>

  <!-- Fullscreen Video Modal -->
  <div class="modal" id="videoModal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Now Playing</span>
      <button class="close-btn" id="closeModal">✕ Close</button>
    </div>
    <div class="player-wrapper" id="playerContainer"></div>
    <a class="modal-cta" id="modalWaLink" href="#" target="_blank" rel="noopener">
      💬 Order an AI Video Like This on WhatsApp
    </a>
  </div>

  <!-- Sticky Bottom Conversion Bar -->
  <div class="bottom-bar">
    <div class="bottom-text">
      <strong>Need an AI Promo Video for Your Business?</strong>
      <span>Gemini Twins Online Services • East London</span>
    </div>
    <a class="wa-btn" href="https://wa.me/27679867629?text=Hi%20Luthando%2C%20I%20saw%20your%20Gemini%20Twins%20AI%20Cinema%20and%20want%20to%20order%20a%20custom%20AI%20promo%20video." target="_blank" rel="noopener">
      WhatsApp Us
    </a>
  </div>

  <script>
    const VIDEOS = [
      {
        title: "Gemini Job Finder Is Live",
        category: "podcasts",
        tag: "App & Tech",
        series: "Gemini Twins • @luthandodanxa2685",
        youtubeId: "l6bMirXKCjI"
      },
      {
        title: "Gemini Twins Digital Hub Launch",
        category: "podcasts",
        tag: "Web Dev",
        series: "Acode • HTML • JS • Netlify",
        youtubeId: "jSP1YSYDmjk"
      },
      {
        title: "Building With AI & Automation",
        category: "podcasts",
        tag: "AI & Tech",
        series: "Blueprint & Execution",
        youtubeId: "ahgARcd-dt4"
      },
      {
        title: "What to Expect in 2030: AI & Work",
        category: "scifi",
        tag: "Future Tech",
        series: "AI 2030 & UBI",
        youtubeId: "8C5LZmbFJfo"
      },
      {
        title: "Festive Coding & Deep Work Focus",
        category: "podcasts",
        tag: "Coding Life",
        series: "Software & Dev Mindset",
        youtubeId: "F3vdBcKLm50"
      },
      {
        title: "Karmic Justice & Divine Timing",
        category: "horror",
        tag: "Spiritual",
        series: "Lightworkers & Protection",
        youtubeId: "cyczP55CxQ0"
      },
      {
        title: "Inner Peace & Meditation",
        category: "horror",
        tag: "Mindfulness",
        series: "Calm & Spiritual Awakening",
        youtubeId: "kGQXoy9GF14"
      },
      {
        title: "East London Beach Safety Alert",
        category: "ads",
        tag: "Local Alert",
        series: "Eastern Beach & Lifeguard Notice",
        youtubeId: "nVeN6S6yKBI"
      }
    ];

    const videoGrid = document.getElementById("videoGrid");
    const videoCount = document.getElementById("videoCount");
    const currentChannelLabel = document.getElementById("currentChannelLabel");
    const channelButtons = document.querySelectorAll(".channel-btn");

    const modal = document.getElementById("videoModal");
    const modalTitle = document.getElementById("modalTitle");
    const playerContainer = document.getElementById("playerContainer");
    const modalWaLink = document.getElementById("modalWaLink");
    const closeModalBtn = document.getElementById("closeModal");

    function renderVideos(filter = "all") {
      const filtered = filter === "all"
        ? VIDEOS
        : VIDEOS.filter(v => v.category === filter);

      videoCount.textContent = `${filtered.length} ${filtered.length === 1 ? "Reel" : "Reels"}`;
      videoGrid.innerHTML = "";

      filtered.forEach(video => {
        const card = document.createElement("div");
        card.className = "video-card";

        const thumbUrl = `https://img.youtube.com/vi/${video.youtubeId}/hqdefault.jpg`;

        card.innerHTML = `
          <div class="thumb-box">
            <img src="${thumbUrl}" alt="${video.title}" loading="lazy" />
            <div class="play-overlay">
              <span class="tag-pill">${video.tag}</span>
              <div class="play-circle">▶</div>
              <span></span>
            </div>
          </div>
          <div class="card-meta">
            <h3>${video.title}</h3>
            <p>${video.series}</p>
          </div>
        `;

        card.addEventListener("click", () => openPlayer(video));
        videoGrid.appendChild(card);
      });
    }

    function openPlayer(video) {
      modalTitle.textContent = video.title;
      playerContainer.innerHTML = `
        <iframe
          src="https://www.youtube.com/embed/${video.youtubeId}?autoplay=1&rel=0&playsinline=1"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      `;

      const message = encodeURIComponent(
        `Hi Luthando, I just watched "${video.title}" on Gemini Twins Cinema and would like to enquire about an AI video.`
      );
      modalWaLink.href = `https://wa.me/27679867629?text=${message}`;
      modal.classList.add("open");
    }

    function closePlayer() {
      modal.classList.remove("open");
      playerContainer.innerHTML = "";
    }

    channelButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        channelButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const filter = btn.getAttribute("data-filter");
        currentChannelLabel.textContent = `Showing: ${btn.textContent}`;
        renderVideos(filter);
      });
    });

    closeModalBtn.addEventListener("click", closePlayer);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closePlayer();
    });

    renderVideos("all");
  </script>
</body>
</html>
